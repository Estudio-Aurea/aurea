<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Aurea | Premium Web Design Studio</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Aurea is a premium web design studio crafting elegant, high-performance websites that elevate brands, build trust, and create memorable digital experiences."
    />

    <meta
      name="keywords"
      content="web design, website designer, premium websites, business websites, web development, responsive websites, UI UX design, Aurea"
    />

    <meta name="author" content="Aurea" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Canonical -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aurea | Premium Web Design Studio" />
    <meta
      property="og:description"
      content="Premium websites designed to elevate brands through strategy, design and development."
    />

    <meta
      property="og:image"
      content="https://your-domain.com/og-image.jpg"
    />

    <meta
      property="og:url"
      content="https://your-domain.com/"
    />

    <meta property="og:site_name" content="Aurea" />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Aurea | Premium Web Design Studio"
    />

    <meta
      name="twitter:description"
      content="Premium websites designed to elevate brands."
    />

    <meta
      name="twitter:image"
      content="https://your-domain.com/og-image.jpg"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
